<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="서울아산병원 직원식당의 오늘 메뉴와 예상 대기를 한눈에 보여 주는 시연용 웹앱이에요."
    />
    <!-- CSS 토큰이 닿지 않는 메타 태그라 design/tokens.css 의 --deep 값을 그대로 옮긴다 -->
    <meta name="theme-color" content="#004F51" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06393A" media="(prefers-color-scheme: dark)" />
    <title>아산 밥때</title>
    <!-- React가 뜨기 전에 저장된 테마(babttae.theme, JSON 문자열) 또는 시스템 설정으로 dark를 먼저 붙여 깜빡임을 막는다 -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("babttae.theme") || '"system"')
          var dark =
            saved === "dark" ||
            (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
